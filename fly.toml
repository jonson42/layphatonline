# fly.toml app configuration file generated for layphatonline on 2026-11-01T02:25:57Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'layphatonline'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
